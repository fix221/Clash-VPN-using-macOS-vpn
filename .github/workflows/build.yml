name: Build macOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build macOS App
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: List available Xcode versions
        run: |
          ls /Applications/ | grep Xcode
          xcodebuild -version
      
      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
      
      - name: List available schemes
        run: |
          xcodebuild -list -project MyClash.xcodeproj
      
      - name: Build MyClash app
        run: |
          mkdir -p build
          xcodebuild clean build \
            -project MyClash.xcodeproj \
            -scheme MyClash \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
      
      - name: Archive build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MyClash-build
          path: |
            build/DerivedData/Build/Products/Debug/MyClash.app
          retention-days: 30
      
      - name: Create DMG (optional)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          mkdir -p dist
          cp -R build/DerivedData/Build/Products/Debug/MyClash.app dist/
          hdiutil create -volname "MyClash" -srcfolder dist/MyClash.app -ov -format UDZO dist/MyClash.dmg
      
      - name: Upload DMG artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: MyClash-dmg
          path: dist/MyClash.dmg
          retention-days: 90
